<!DOCTYPE html><html><head><meta charset="utf-8"><title>batched prefill self-test</title>
<style>body{font:14px ui-monospace,monospace;background:#0d1117;color:#c9d1d9;padding:1.5rem}
pre{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:1rem;white-space:pre-wrap}
.ok{color:#3fb950}.bad{color:#f85149}button{font:inherit;background:#21262d;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;padding:.4rem .9rem;cursor:pointer}</style>
</head><body>
<h3>Batched prefill (gemm_tern_b4) vs sequential — equivalence</h3>
<button id="go">Run</button> <pre id="out">—</pre>
<script src="_cpukern/cpuengine-mt.js"></script>
<script>
const log = t => document.getElementById('out').textContent += t + '\n';
document.getElementById('go').onclick = async () => {
  document.getElementById('out').textContent = '';
  try {
    log('COI=' + self.crossOriginIsolated + '  loading model…');
    globalThis.__chunkMode = true; globalThis.__lutMode = false;
    const t0 = performance.now();
    await CPUEngineMT.load('bonsai17.cpu.bin', 4);
    log('loaded in ' + ((performance.now()-t0)/1000).toFixed(1) + 's');
    for (const ids of [[9707,11,1879,25],[40,1079,264,4222],[151644,872,198,3838]]) {
      const r = CPUEngineMT._selfTestBatch(ids);
      log(JSON.stringify(ids) + ' → seq=' + r.seqLast + ' batched=' + r.bat +
          '  ' + (r.ok ? 'MATCH ✓' : 'MISMATCH ✗') +
          '   seq ' + r.msSeq + 'ms / batched ' + r.msBat + 'ms = ' + r.speedup + '×');
    }
    log('done');
  } catch (e) { log('ERROR: ' + (e && e.message || e)); console.error(e); }
};
</script></body></html>
